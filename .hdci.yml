---
use_templates:
  - Charles546/honeydipper-ci@refs/heads/main:resources/hdci.tmpl.yml

settings:
  worker: podman_default

cache:
  - /go/pkg/mod
  - /go/bin
  - /tmp/go-build

executors:
  golang:
    image: docker.io/library/golang:1.27.3-alpine
    cache:
      - /go/pkg/mod
      - /go/bin
      - /tmp/go-build
    env:
      GOCACHE: /tmp/go-build

default_executors+:
  - golang

triggers:
  - conditions:
      gh_event: push
      git_ref!:
        - 'refs/heads/main'
        - ":regex:^refs\\/tags\\/v.*"
      git_commit_message!: ':regex:.*\[skip ci\].*'
    stages:
      - install-and-cache
      - test
      - lint
  - conditions:
      gh_event: push
      git_ref: 'refs/heads/main'
      git_commit_message!: ':regex:.*\[skip ci\].*'
    stages:
      - install-and-cache
      - release
  - conditions:
      gh_event: release
      gh_action: released
    stages:
      - update-registry
      - back-merge

stages:
  install-and-cache:
    jobs:
      - job_name: go-install
        steps:
          - run: go install ./...
  test:
    requires:
      - install-and-cache
    jobs:
      - job_name: go_test
        steps:
          - run: |
              for i in $(seq 1 3); do
                echo "Running test iteration $i..."
                go test -count=1 -v ./... && sleep 5
              done

  lint:
    requires:
      - install-and-cache
    jobs:
      - job_name: lint
        steps:
          - run: golangci-lint run
            image: docker.io/golangci/golangci-lint:v2.15.0-alpine

  release:
    requires:
      - install-and-cache
    jobs:
      - job_name: semantic-release
        steps:
          - image: docker.io/library/node:22-alpine
            run: |
              cp /go/bin/hd-driver-docker ./hd-driver-docker-linux-amd64

              apk add --no-cache git
              npm install -g semantic-release \
                @semantic-release/changelog \
                @semantic-release/git \
                @semantic-release/github \
                @semantic-release/commit-analyzer \
                @semantic-release/release-notes-generator
              npx semantic-release
            skip_executors:
              - golang
            cache:
              - /go/bin
            env:
              GITHUB_TOKEN: hd-lookup:github_pat

  update-registry:
    jobs:
      - job_name: update-registry
        workflow: relay
        ctx:
          relay_track: update-registry
          relay_git_repo: Charles546/honeydipper-registry
          relayed_data:
            driver_name: docker
            manifest_file: docker.json
            update_latest: true
            update_channel: stable
            version: '{{ trimPrefix "refs/tags/" .git_ref }}'
            sha256: '{{ with .gh_asset_digest }}{{ trimPrefix "sha256:" . }}{{ end }}'
            asset_url: $gh_asset_url,""
            binary_name: $gh_asset_name,""
  back-merge:
    jobs:
      - job_name: back-merge
        # CRITICAL: the released event's git_ref is a tag refpath
        # (refs/tags/vX.Y.Z), which the default github_checkout cannot clone
        # ("Remote branch refs/tags/vX.Y.Z not found"). GITHUB_BRANCH is read
        # by the checkout via ${GITHUB_BRANCH:-...}, and job-level env reaches
        # every step container, so force a cloneable branch here. The stage
        # re-fetches and checks out dev itself, so any valid branch works.
        env:
          GITHUB_BRANCH: main
        steps:
          - executor: gh
            skip_executors:
              - golang
            env:
              GH_TOKEN: hd-lookup:github_pat
            run: |
              set -e
              git config --global user.name "HoneyDipper CI"
              git config --global user.email "honeydipper-ci@example.com"

              git fetch origin main dev
              git checkout -B dev origin/dev

              if ! git merge --no-edit -m "chore: merge main into dev [skip ci]" origin/main; then
                echo "ERROR: back-merge conflict; aborting, dev left untouched"
                git merge --abort
                exit 1
              fi

              if git diff --quiet origin/dev HEAD; then
                echo "dev already up to date with main; nothing to push"
                exit 0
              fi

              git push origin HEAD:dev
